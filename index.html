<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gutentag0004 Blog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, serif;
      background: #f9f9f9;
      color: #222;
      line-height: 1.7;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 1.5rem 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      letter-spacing: -0.5px;
    }

    header p {
      color: #666;
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }

    main {
      max-width: 680px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    article {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 2rem;
    }

    article h2 {
      font-size: 1.4rem;
      margin-bottom: 0.4rem;
    }

    article time {
      font-size: 0.82rem;
      color: #888;
      display: block;
      margin-bottom: 1rem;
    }

    article p {
      font-size: 1rem;
      color: #444;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gutentag0004</h1>
    <p>A personal blog</p>
  </header>

  <main>
    <article>
      <h2>Hello, World!</h2>
      <time datetime="2026-08-30">August 30, 2026</time>
      <p>Welcome to my blog. This is the first post — more to come.</p>
    </article>
  </main>

  <footer>
    &copy; 2026 Gutentag0004
  </footer>

</body>
</html>
