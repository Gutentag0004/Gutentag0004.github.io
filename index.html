<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gutentag0004</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #111;
      --dark: #222;
      --muted: #888;
      --border: #ddd;
      --bg: #fff;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--dark);
      line-height: 1.7;
    }

    /* ── Top bar ── */
    .topbar {
      background: var(--black);
      color: #fff;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }

    .topbar .site-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
      text-decoration: none;
    }

    .topbar nav {
      display: flex;
      gap: 1.75rem;
    }

    .topbar nav a {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ccc;
      text-decoration: none;
      transition: color 0.15s;
    }

    .topbar nav a:hover { color: #fff; }

    /* ── Hero / page title ── */
    .hero {
      border-bottom: 1px solid var(--border);
      padding: 3.5rem 2rem 2.5rem;
      text-align: center;
    }

    .hero h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: var(--black);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .hero p {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* ── Main layout ── */
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    /* ── Post list ── */
    .post-list {
      list-style: none;
      margin-top: 2.5rem;
    }

    .post-list li {
      border-top: 1px solid var(--border);
      padding: 1.75rem 0;
    }

    .post-list li:last-child {
      border-bottom: 1px solid var(--border);
    }

    .post-list a {
      text-decoration: none;
      display: block;
    }

    .post-meta {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    .post-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--black);
      line-height: 1.3;
      margin-bottom: 0.5rem;
      transition: color 0.15s;
    }

    .post-list a:hover .post-title {
      color: #555;
    }

    .post-excerpt {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.65;
    }

    .read-more {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--black);
      border-bottom: 1px solid var(--black);
      padding-bottom: 1px;
      transition: opacity 0.15s;
    }

    .post-list a:hover .read-more { opacity: 0.5; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 1.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: #bbb;
    }

    @media (max-width: 560px) {
      .topbar nav { gap: 1rem; }
      .topbar nav a { font-size: 0.7rem; }
      .hero { padding: 2.5rem 1.5rem 2rem; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="site-name" href="/">Gutentag0004</a>
    <nav>
      <a href="/">Blog</a>
      <a href="/about">About</a>
    </nav>
  </div>

  <div class="hero">
    <h1>Writing</h1>
    <p>Thoughts on code, ideas, and everything in between</p>
  </div>

  <main>
    <ul class="post-list">

      <li>
        <a href="#">
          <div class="post-meta">Aug 30, 2026</div>
          <div class="post-title">Hello, World!</div>
          <div class="post-excerpt">Welcome to my blog. This is the first post — more to come. Stay tuned for thoughts on engineering, tools, and things I find interesting.</div>
          <span class="read-more">Read more</span>
        </a>
      </li>

    </ul>
  </main>

  <footer>
    &copy; 2026 Gutentag0004
  </footer>

</body>
</html>
